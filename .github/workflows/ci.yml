name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  # The merge queue's speculative merge commits — without this trigger, a
  # queued PR waits forever for a required check that never starts.
  merge_group:

# One job used to run build + every package's tests + lint + e2e on a single
# two-core runner (#591). `turbo run test` fans all packages out in parallel and
# each one's vitest forks its own worker pool, so at peak that runner hosted the
# server suite's testcontainers Postgres, the web suite's 133 jsdom files, and
# five more suites at once. Whichever suite lost the CPU race hit whichever
# fixed timeout it happened to be standing on — failures that were
# timeout-shaped, load-sensitive, and never the same test twice, on branches
# that could not have caused them.
#
# The suites now get a runner each. Parallelism stays *between* runners and is
# gone *within* one, which is what the flakes were about; nothing here raises a
# budget, because raising budgets hides the symptom and slows every genuine
# failure's feedback loop. It also shortens the critical path: e2e (~8.5 min of
# the old job's ~13) no longer waits behind ~2.5 min of tests and lint.
#
# `build-test-lint` survives as the aggregator at the bottom — it is the one
# required status check on `main`, so keeping the name means branch protection
# needs no edit and no window opens where nothing is required.
jobs:
  build-lint:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The whole-workspace typecheck as well as the build — no other job runs
      # `build` unfiltered, so this is what fails on a type error in a package
      # the test legs don't pull in.
      - run: pnpm build
      - run: pnpm lint

  # The heaviest single suite, and the only one that wants Docker: its
  # testcontainers Postgres and fchat-sim get the runner to themselves.
  test-server:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@emberchat/server

  # 133 jsdom files across a worker pool — the suite most sensitive to losing
  # the CPU race, and the source of two of the three #591 sightings.
  test-web:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@emberchat/web

  # Everything else — desktop plus the six pure packages. Negation filters so a
  # new package joins this leg by existing, rather than being silently untested
  # until someone remembers to list it.
  test-packages:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm turbo run test
          --filter=!@emberchat/server
          --filter=!@emberchat/web

  e2e:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Two second engines, each scoped to where it can disagree (see
      # playwright.config.ts). Firefox: the typography spec's carets and font
      # metrics, plus the open-at-the-tail family — neither measurable from the
      # DOM. WebKit: the phone specs on an iPhone-class descriptor, which is
      # the closest automatable thing to the engine MP2's keyboard module and
      # MP3's install metadata were written for.
      - run: pnpm --filter @emberchat/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm turbo e2e
      # Not `if: failure()`: a flake that fails once and passes on the retry
      # leaves a green job, and the first attempt's trace would die with the
      # runner — exactly the evidence a flake hunt needs. Uploading always
      # keeps it; `if-no-files-found: ignore` means a run with nothing to
      # report (all green, or a failure before e2e) uploads nothing.
      - name: Upload Playwright report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e-server.log
          retention-days: 7
          if-no-files-found: ignore

  # The storage seam's second driver (MX2, #298). The desktop client will run
  # the server's own code on pglite, so the seam needs a leg that fails when it
  # rots — but a full second server suite would double CI's wall time for a
  # driver no deployment uses. This runs the db-heaviest files only, and needs
  # no Docker at all (pglite is in-process WASM), so it is cheap and parallel.
  #
  # Three tests are skipped here on purpose, all for the same reason — pglite
  # is one Postgres inside one process:
  #
  #   * history's write-queue sharding needs two connections, and an open
  #     transaction on a single-connection database blocks forever
  #     (design/mx2-pglite-spike.md §Q2);
  #   * the two admin-CLI tests need a second *process*, and two processes
  #     over one pglite data directory see two different databases (#558).
  #
  # All three still run, unweakened, in `test-server` — which is the run that
  # protects those properties on a server. `src/modules/auth` is in the subset
  # regardless: it is the only suite that meets the CLI at all, so leaving it
  # out left that path CI-blind.
  pglite:
    name: server-suite-pglite
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      TEST_DB_DRIVER: pglite
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@emberchat/server...
      - run: >-
          pnpm --filter @emberchat/server exec vitest run
          src/db/upgrade-gate.test.ts
          src/modules/auth
          src/modules/gateway
          src/modules/history
          src/modules/notifications

  # Boots the production image against a real Postgres and asserts /healthz.
  # Catches whole-image failures the workspace test suite can't see — missing
  # dist copies in the runtime stage, broken migrations-on-boot, bad CMD.
  image-smoke:
    name: image-boot-smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: emberchat
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: emberchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emberchat"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runtime -t emberchat-smoke .
      - name: Boot image and probe /healthz
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://emberchat:ci-only@localhost:5432/emberchat \
            -e AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n') \
            emberchat-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then exit 0; fi
            if [ -z "$(docker ps -q -f name=smoke)" ]; then break; fi
            sleep 1
          done
          echo "::error::server image failed to boot"
          docker logs smoke
          exit 1

  # The single required status check on `main` (branch protection, `strict`).
  # It carries the name the one big job used to have, so splitting that job
  # into five needed no protection edit — and adding or renaming a leg in
  # future only means editing `needs` here, never the repo settings.
  #
  # `if: always()` so the check still reports when a leg fails or is skipped;
  # without it this job would be skipped too, and a skipped required check
  # blocks the PR forever with no failure to read. The `contains` test is what
  # actually enforces the legs: `needs.*.result` is every dependency's outcome,
  # and anything that is not `success` fails the aggregate.
  #
  # Deliberately *not* in `needs`: `server-suite-pglite` and `image-boot-smoke`.
  # Neither gated merges before this split, and making them blocking is a
  # merge-policy change rather than a flake fix.
  build-test-lint:
    name: build-test-lint
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [build-lint, test-server, test-web, test-packages, e2e]
    steps:
      - name: Verify every leg succeeded
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "leg results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a CI leg did not succeed ($results)"
              exit 1
            fi
          done
